# Weekly version updates for npm. Security alerts open pull requests on their own.
# Versions are pinned exactly in package.json, so Dependabot proposes each bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7 breaks npm ci: @astrojs/check accepts only TypeScript 5 or 6.
    # Remove this once @astrojs/check lists version 7 as a peer.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    # Group the minor and patch bumps into one pull request to keep the noise low.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
