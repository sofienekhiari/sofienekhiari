<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" role="img" aria-labelledby="advice-outline-2-title advice-outline-2-desc"><title id="advice-outline-2-title">The three things to try, in order</title><desc id="advice-outline-2-desc">Three stacked bands read from the bottom up, with an arrow up the side marked still not right, go up. How you ask, holding give it a finish line and brief it like a colleague. Reach for the right tool, holding use the tool that already has it and plug in what it needs to reach. And at the top, teach it, either with one instruction or with a written skill. The band marked Reach for the right tool is picked out in teal, because it is the one being talked about next.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><text x="24" y="20" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">STILL NOT</text><text x="24" y="34" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">RIGHT? GO UP</text><line x1="76" y1="416" x2="76" y2="48" stroke="#7d9092" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow-soft)"/><rect x="128" y="40" width="840" height="384" rx="10" fill="#ffffff" stroke="rgba(20,32,31,0.16)" stroke-width="1.2"/><line x1="128" y1="296" x2="968" y2="296" stroke="#dfe7e7" stroke-width="1"/><text x="204" y="338" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#14201f">How you ask</text><text x="160" y="376" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7d9092">1</text><text x="204" y="376" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="rgba(20,32,31,0.86)">Give it a finish line it can check</text><text x="936" y="376" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">say how you will know it is done</text><text x="160" y="404" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7d9092">2</text><text x="204" y="404" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="rgba(20,32,31,0.86)">Brief it like a colleague</text><text x="936" y="404" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">full sentences, the context, an example</text><rect x="128" y="168" width="840" height="128" rx="10" fill="rgba(0,128,128,0.07)" stroke="none"/><line x1="128" y1="168" x2="968" y2="168" stroke="#dfe7e7" stroke-width="1"/><text x="204" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#006464">Reach for the right tool</text><text x="160" y="248" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#008080">3</text><text x="204" y="248" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#006464">Use the tool that already has it</text><text x="936" y="248" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">a platform built for that job</text><text x="160" y="276" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#008080">4</text><text x="204" y="276" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#006464">Plug in what it needs to reach</text><text x="936" y="276" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">check whether a connector exists first</text><text x="204" y="82" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#14201f">Teach it</text><text x="160" y="120" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7d9092">5</text><text x="204" y="120" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="rgba(20,32,31,0.86)">An instruction</text><text x="936" y="120" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">one sentence, in its settings</text><text x="204" y="148" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="rgba(20,32,31,0.86)">A skill</text><text x="936" y="148" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#7d9092">a page it opens only when it needs it</text><rect x="128" y="168" width="840" height="128" rx="10" fill="none" stroke="#008080" stroke-width="1.4"/></svg>