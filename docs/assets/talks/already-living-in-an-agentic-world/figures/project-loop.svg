<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 432" width="1136" height="432" role="img" aria-labelledby="project-loop-title project-loop-desc"><title id="project-loop-title">One piece of laboratory work, as a loop</title><desc id="project-loop-desc">Four stations in a row, joined left to right, with a return running back underneath them. What is known, drawn from every run you have done including the failures, and from the literature searched as a corpus. The protocol to try, marked options you pick one, holding options drawn from both with the case for and against each. Make and measure, holding automated synthesis, purification and characterisation. And the result, read, analysed and written into your notebook. From there a fork asks whether it is good enough: you choose to stop, or to go round again with one more run in it.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><line x1="1000" y1="172" x2="1000" y2="284" stroke="#008080" stroke-width="1.8"/><path d="M 1000,300 V 391 A 9 9 0 0 1 991,400 H 145 A 9 9 0 0 0 136,391 V 174" fill="none" stroke="#008080" stroke-width="1.8" marker-end="url(#sx-arrow-accent)"/><text x="568" y="386" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.14em" fill="#006464">NOT GOOD ENOUGH YET, GO ROUND AGAIN WITH ONE MORE RUN IN IT</text><line x1="1010" y1="292" x2="1052" y2="292" stroke="#7d9092" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#sx-arrow-soft)"/><text x="1060" y="296" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.14em" fill="#7d9092">DONE</text><line x1="274" y1="98.0" x2="284" y2="98.0" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><line x1="562" y1="98.0" x2="572" y2="98.0" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><line x1="850" y1="98.0" x2="860" y2="98.0" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><rect x="0" y="24" width="272" height="148" rx="9" fill="#ffffff"/><rect x="0" y="24" width="272" height="148" rx="9" fill="#ffffff" stroke="rgba(20,32,31,0.22)" stroke-width="1.2"/><text x="14" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#14201f">What is known</text><text x="14" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">every run, including the failures</text><text x="14" y="125" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">and the literature, as a corpus</text><rect x="288" y="24" width="272" height="148" rx="9" fill="#ffffff"/><rect x="288" y="24" width="272" height="148" rx="9" fill="#e6f2f2" stroke="#b3d9d9" stroke-width="1.2"/><text x="302" y="54" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.14em" fill="#006464">OPTIONS, YOU PICK ONE</text><text x="302" y="90" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#006464">The protocol to try</text><text x="302" y="118" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">options drawn from both, each with</text><text x="302" y="139" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">the case for it and against it</text><rect x="576" y="24" width="272" height="148" rx="9" fill="#ffffff"/><rect x="576" y="24" width="272" height="148" rx="9" fill="#ffffff" stroke="rgba(20,32,31,0.22)" stroke-width="1.2"/><text x="590" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#14201f">Make and measure</text><text x="590" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">automated synthesis, purification</text><text x="590" y="125" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">and characterisation</text><rect x="864" y="24" width="272" height="148" rx="9" fill="#ffffff"/><rect x="864" y="24" width="272" height="148" rx="9" fill="#ffffff" stroke="rgba(20,32,31,0.22)" stroke-width="1.2"/><text x="878" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#14201f">The result</text><text x="878" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">read, analysed, and written into</text><text x="878" y="125" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">your notebook as it goes</text><circle cx="1000" cy="292" r="7" fill="#008080" stroke="#ffffff" stroke-width="2.5"/><text x="982" y="296" text-anchor="end" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.14em" fill="#006464">GOOD ENOUGH? YOU CHOOSE</text></svg>