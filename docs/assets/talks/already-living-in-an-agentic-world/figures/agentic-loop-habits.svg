<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 536" width="672" height="536" role="img" aria-labelledby="agentic-loop-habits-title agentic-loop-habits-desc"><title id="agentic-loop-habits-title">The agentic loop</title><desc id="agentic-loop-habits-desc">The same agentic loop, with the first habit marked against the task going in and the second against the check that decides the job is done.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><path d="M 199.08,216.00 A 168 168 0 0 1 270.33,108.53" fill="none" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><path d="M 456.00,107.43 A 168 168 0 0 1 528.53,214.04" fill="none" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><path d="M 528.92,280.00 A 168 168 0 0 1 457.67,387.47" fill="none" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><path d="M 272.00,388.57 A 168 168 0 0 1 199.47,281.96" fill="none" stroke="#45585a" stroke-width="1.6" marker-end="url(#sx-arrow)"/><line x1="48" y1="248" x2="96" y2="248" stroke="#7d9092" stroke-width="1.6" marker-end="url(#sx-arrow-soft)"/><text x="24" y="270" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">THE TASK</text><line x1="364" y1="448" x2="364" y2="492" stroke="#7d9092" stroke-width="1.6" marker-end="url(#sx-arrow-soft)"/><text x="364" y="512" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">BACK TO YOU</text><rect x="187" y="367" width="57" height="14" rx="2" fill="#ffffff"/><text x="215" y="377" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.1em" fill="#006464">NOT YET</text><rect x="104" y="216" width="184" height="64" rx="8" fill="#ffffff"/><rect x="104" y="216" width="184" height="64" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="122" y="242" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#14201f">Think</text><text x="122" y="263" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">what to do next</text><rect x="272" y="48" width="184" height="64" rx="8" fill="#ffffff"/><rect x="272" y="48" width="184" height="64" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="290" y="74" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#14201f">Act</text><text x="290" y="95" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">use a tool</text><rect x="440" y="216" width="184" height="64" rx="8" fill="#ffffff"/><rect x="440" y="216" width="184" height="64" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="458" y="242" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#14201f">Observe</text><text x="458" y="263" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">what happened</text><rect x="272" y="384" width="184" height="64" rx="8" fill="#ffffff"/><rect x="272" y="384" width="184" height="64" rx="8" fill="#e6f2f2" stroke="#008080" stroke-width="1.2"/><text x="290" y="410" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#006464">Done?</text><text x="290" y="431" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">check against the goal</text><text x="364" y="252" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.14em" fill="#7d9092">THE AGENTIC LOOP</text><circle cx="452.00000000000006" cy="388.0" r="15" fill="#008080" stroke="#ffffff" stroke-width="2.5"/><text x="452.00000000000006" y="393.0" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#ffffff">1</text><circle cx="60.0" cy="220.00000000000003" r="15" fill="#008080" stroke="#ffffff" stroke-width="2.5"/><text x="60.0" y="225.00000000000003" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#ffffff">2</text></svg>