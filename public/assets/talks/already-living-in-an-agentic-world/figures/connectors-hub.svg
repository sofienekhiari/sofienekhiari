<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 472" width="1136" height="472" role="img" aria-labelledby="connectors-hub-title connectors-hub-desc"><title id="connectors-hub-title">What an agent plugs into</title><desc id="connectors-hub-desc">An agent in the middle. Five kinds of thing inform it from the left: the published record, structured databases, computation, model hubs, and your own files. Three let it act, to the right: your record, what it makes, and the outside world.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><rect x="8" y="24" width="408" height="396" rx="10" fill="rgba(20,32,31,0.02)" stroke="rgba(20,32,31,0.14)" stroke-width="1" stroke-dasharray="6,5"/><rect x="24" y="17" width="149" height="14" rx="2" fill="#ffffff"/><text x="32" y="28" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">FIVE THAT INFORM IT</text><rect x="720" y="96" width="408" height="252" rx="10" fill="rgba(20,32,31,0.02)" stroke="#b3d9d9" stroke-width="1" stroke-dasharray="6,5"/><rect x="736" y="89" width="163" height="14" rx="2" fill="#ffffff"/><text x="744" y="100" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#006464">THREE THAT LET IT ACT</text><line x1="408" y1="86" x2="464" y2="86" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="158" x2="464" y2="158" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="230" x2="464" y2="230" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="302" x2="464" y2="302" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="374" x2="464" y2="374" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="672" y1="158" x2="728" y2="158" stroke="#008080" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow-accent)"/><line x1="672" y1="230" x2="728" y2="230" stroke="#008080" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow-accent)"/><line x1="672" y1="302" x2="728" y2="302" stroke="#008080" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow-accent)"/><rect x="472" y="56" width="192" height="348" rx="12" fill="#008080"/><text x="568" y="226" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#ffffff">the agent</text><text x="568" y="250" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#cfe6e6">the chat you already use</text><rect x="24" y="56" width="376" height="60" rx="8" fill="#ffffff"/><rect x="24" y="56" width="376" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="82" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">The published record</text><text x="42" y="103" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Consensus, PubMed, arXiv, bioRxiv</text><rect x="24" y="128" width="376" height="60" rx="8" fill="#ffffff"/><rect x="24" y="128" width="376" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="154" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Structured databases</text><text x="42" y="175" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">ChEMBL, PubChem, UniProt, the PDB</text><rect x="24" y="200" width="376" height="60" rx="8" fill="#ffffff"/><rect x="24" y="200" width="376" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="226" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Computation</text><text x="42" y="247" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">it writes and runs its own code</text><rect x="24" y="272" width="376" height="60" rx="8" fill="#ffffff"/><rect x="24" y="272" width="376" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="298" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Model hubs</text><text x="42" y="319" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Hugging Face, specialist predictors</text><rect x="24" y="344" width="376" height="60" rx="8" fill="#ffffff"/><rect x="24" y="344" width="376" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="370" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Your files, and your group&#39;s</text><text x="42" y="391" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Drive, SharePoint, a shared folder</text><rect x="736" y="128" width="376" height="60" rx="8" fill="#ffffff"/><rect x="736" y="128" width="376" height="60" rx="8" fill="rgba(20,32,31,0.05)" stroke="#45585a" stroke-width="1.2"/><text x="754" y="154" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Your record</text><text x="754" y="175" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">a lab notebook, Notion, Benchling</text><rect x="736" y="200" width="376" height="60" rx="8" fill="#ffffff"/><rect x="736" y="200" width="376" height="60" rx="8" fill="rgba(20,32,31,0.05)" stroke="#45585a" stroke-width="1.2"/><text x="754" y="226" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">What it makes</text><text x="754" y="247" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">code, figures, documents, a repository</text><rect x="736" y="272" width="376" height="60" rx="8" fill="#ffffff"/><rect x="736" y="272" width="376" height="60" rx="8" fill="rgba(20,32,31,0.05)" stroke="#45585a" stroke-width="1.2"/><text x="754" y="298" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">The outside world</text><text x="754" y="319" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">mail, calendar, tickets, orders</text><text x="24" y="448" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#7d9092">after one of these, the world is exactly as it was</text><text x="736" y="448" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#006464">after one of these, something out there is different</text></svg>