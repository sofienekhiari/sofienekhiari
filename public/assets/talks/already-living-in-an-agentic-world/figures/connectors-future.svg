<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 460" width="1136" height="460" role="img" aria-labelledby="connectors-future-title connectors-future-desc"><title id="connectors-future-title">What a connector could be</title><desc id="connectors-future-desc">The same agent, with four laboratory instruments plugged into it inside a dashed outline marked your building, and one two-way line crossing that outline to a laboratory somewhere else that is paid by the run.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><rect x="8" y="32" width="704" height="396" rx="10" fill="rgba(20,32,31,0.02)" stroke="rgba(20,32,31,0.14)" stroke-width="1" stroke-dasharray="6,5"/><rect x="24" y="25" width="107" height="14" rx="2" fill="#ffffff"/><text x="32" y="36" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">YOUR BUILDING</text><line x1="408" y1="100" x2="464" y2="100" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="192" x2="464" y2="192" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="284" x2="464" y2="284" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="408" y1="376" x2="464" y2="376" stroke="#45585a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#sx-arrow)"/><line x1="672" y1="238" x2="776" y2="238" stroke="#008080" stroke-width="1.6" stroke-linecap="round" marker-start="url(#sx-arrow-accent)" marker-end="url(#sx-arrow-accent)"/><rect x="673" y="216" width="103" height="14" rx="2" fill="#ffffff"/><text x="724" y="226" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.1em" fill="#006464">PAY BY THE RUN</text><rect x="472" y="64" width="192" height="348" rx="12" fill="#008080"/><text x="568" y="234" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#ffffff">the agent</text><text x="568" y="258" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#cfe6e6">the chat you already use</text><rect x="24" y="64" width="376" height="72" rx="8" fill="#ffffff"/><rect x="24" y="64" width="376" height="72" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="90" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">The plate reader</text><text x="42" y="111" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">runs the assay, hands back the numbers</text><rect x="24" y="156" width="376" height="72" rx="8" fill="#ffffff"/><rect x="24" y="156" width="376" height="72" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">A purification station</text><text x="42" y="203" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">takes the crude, gives back the pure</text><rect x="24" y="248" width="376" height="72" rx="8" fill="#ffffff"/><rect x="24" y="248" width="376" height="72" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="274" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">The synthesiser</text><text x="42" y="295" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">makes what was designed</text><rect x="24" y="340" width="376" height="72" rx="8" fill="#ffffff"/><rect x="24" y="340" width="376" height="72" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="42" y="366" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">The freezer inventory</text><text x="42" y="387" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">what you have, and where it is</text><text x="784" y="154" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#006464">SOMEBODY ELSE&#39;S</text><rect x="784" y="168" width="344" height="140" rx="8" fill="#ffffff"/><rect x="784" y="168" width="344" height="140" rx="8" fill="#e6f2f2" stroke="#008080" stroke-width="1.2"/><text x="802" y="194" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#006464">A lab somewhere else</text><text x="802" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">You do not own the instrument.</text><text x="802" y="246" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#45585a">You reach it, and pay by the run.</text></svg>