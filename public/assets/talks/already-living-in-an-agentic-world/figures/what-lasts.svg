<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 464" width="1120" height="464" role="img" aria-labelledby="what-lasts-title what-lasts-desc"><title id="what-lasts-title">How long each of the three stays useful</title><desc id="what-lasts-desc">A timeline with three tracks, all starting today. What is possible today ends before the next summer school. A few habits run well past it. A way of thinking and working fades out towards the right of the frame, because it has no end in sight.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><defs><linearGradient id="wl-fade" x1="16" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008080" stop-opacity="1"/><stop offset="0.74" stop-color="#008080" stop-opacity="1"/><stop offset="1" stop-color="#008080" stop-opacity="0"/></linearGradient></defs><text x="16" y="28" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">TODAY</text><line x1="16" y1="36" x2="16" y2="436" stroke="rgba(20,32,31,0.18)" stroke-width="1.2"/><text x="520" y="28" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">THE NEXT SUMMER SCHOOL</text><line x1="520" y1="36" x2="520" y2="436" stroke="rgba(20,32,31,0.16)" stroke-width="1.2" stroke-dasharray="5,5"/><text x="28" y="80" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#14201f">What is possible today</text><text x="28" y="106" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#7d9092">out of date before you have finished learning it</text><path d="M 16,120 H 446 A 6 6 0 0 1 452,126 V 154 A 6 6 0 0 1 446,160 H 16 Z" fill="rgba(20,32,31,0.1)" stroke="rgba(20,32,31,0.18)" stroke-width="1"/><text x="28" y="212" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#14201f">A few habits</text><text x="28" y="238" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#7d9092">they outlive the tool you learned them on</text><path d="M 16,252 H 806 A 6 6 0 0 1 812,258 V 286 A 6 6 0 0 1 806,292 H 16 Z" fill="rgba(20,32,31,0.16)" stroke="rgba(20,32,31,0.18)" stroke-width="1"/><text x="28" y="344" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#006464">A way of thinking and working</text><text x="28" y="370" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#45585a">no end in sight</text><path d="M 16,384 H 1114 A 6 6 0 0 1 1120,390 V 418 A 6 6 0 0 1 1114,424 H 16 Z" fill="url(#wl-fade)" stroke="none" stroke-width="1"/></svg>