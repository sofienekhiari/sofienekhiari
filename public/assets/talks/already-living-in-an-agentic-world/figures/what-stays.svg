<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 420" width="552" height="420" role="img" aria-labelledby="what-stays-title what-stays-desc"><title id="what-stays-title">What one piece of work looks like now</title><desc id="what-stays-desc">A run down the page. Deciding what is worth doing, then a quiet band saying the machine does this part, then deciding whether to trust the result, then owning what ships. Below a rule, set apart and picked out, a fourth role: coordinator, running a bench of agents and instruments.</desc><defs><marker id="sx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45585a"/></marker><marker id="sx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#008080"/></marker><marker id="sx-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d9092"/></marker></defs><text x="4" y="16" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#7d9092">ONE PIECE OF WORK</text><line x1="276" y1="86" x2="276" y2="100" stroke="#7d9092" stroke-width="1.4" stroke-linecap="round" marker-end="url(#sx-arrow-soft)"/><line x1="276" y1="150" x2="276" y2="164" stroke="#7d9092" stroke-width="1.4" stroke-linecap="round" marker-end="url(#sx-arrow-soft)"/><line x1="276" y1="230" x2="276" y2="244" stroke="#7d9092" stroke-width="1.4" stroke-linecap="round" marker-end="url(#sx-arrow-soft)"/><rect x="4" y="24" width="544" height="60" rx="8" fill="#ffffff"/><rect x="4" y="24" width="544" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="22" y="50" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Brainstormer</text><text x="22" y="71" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Deciding what is worth doing</text><rect x="4" y="168" width="544" height="60" rx="8" fill="#ffffff"/><rect x="4" y="168" width="544" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="22" y="194" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Supervisor</text><text x="22" y="215" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Deciding whether to trust a result</text><rect x="4" y="248" width="544" height="60" rx="8" fill="#ffffff"/><rect x="4" y="248" width="544" height="60" rx="8" fill="#ffffff" stroke="#14201f" stroke-width="1.2"/><text x="22" y="274" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#14201f">Validator</text><text x="22" y="295" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Owning what ships</text><rect x="4" y="104" width="544" height="44" rx="8" fill="#ffffff"/><rect x="4" y="104" width="544" height="44" rx="8" fill="rgba(20,32,31,0.05)" stroke="#45585a" stroke-width="1.2"/><text x="22" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#14201f">The machine does this part</text><line x1="4" y1="320" x2="548" y2="320" stroke="rgba(20,32,31,0.14)" stroke-width="1"/><text x="4" y="344" text-anchor="start" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.14em" fill="#45585a">AND ONE JOB THAT IS NEW</text><rect x="4" y="352" width="544" height="64" rx="8" fill="#ffffff"/><rect x="4" y="352" width="544" height="64" rx="8" fill="#e6f2f2" stroke="#008080" stroke-width="1.2"/><text x="22" y="378" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#006464">Coordinator</text><text x="22" y="399" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="400" fill="#45585a">Running a bench of agents and instruments</text></svg>